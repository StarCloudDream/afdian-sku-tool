name: 打包

# 打个 tag 推上去，三个平台的成品都打出来，顺手发个 Release 把文件挂上去。
# 也可以到 Actions 页面手动点一下 —— 手动跑只构建、不发 Release。
# Windows 这边其实本地也能打，macOS 和 Linux 就靠这里了 —— PyInstaller 不支持交叉编译，
# 只能各回各家打。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    # Windows runner 的系统编码是 cp1252，中文日志在那上面很容易翻车，统一按 UTF-8 走
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Linux 还要装系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          # pywebview 在 Linux 上靠 PyGObject 和 WebKitGTK，
          # 这两个是系统包，pip 装不到，得让解释器能找到它们
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> "$GITHUB_ENV"

      - name: 打包
        run: python build.py

      # mac 的 .app 是个目录，里面还有符号链接，直接交给 upload-artifact 容易残缺。
      # 用 ditto 压成 zip 最稳（它专门为 mac 的文件属性设计，符号链接和权限都保得住）。
      - name: 收尾（macOS 压成 zip）
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/afdian_sku_app.app dist/afdian_sku_app-macos.zip
          rm -rf dist/afdian_sku_app.app

      # Linux 那个可执行文件也一样，tar 打包能保住可执行位
      - name: 收尾（Linux 压成 tar.gz）
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf afdian_sku_app-linux.tar.gz afdian_sku_app
          rm -f afdian_sku_app
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: afdian-sku-tool-${{ matrix.name }}
          # 自检跑完会在 dist 里留一份 sku_tool.log，那不是给用户的东西，排掉
          path: |
            dist/*
            !dist/sku_tool.log
          if-no-files-found: error

  # 三个平台都成功了才发 Release；只在推 tag 时跑，手动触发就跳过
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # 发 Release 是要往仓库里写东西的，默认 token 权限不够。
    # 只给这个 job 开，build 那边保持默认就行。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 下载下来的每个 artifact 里还裹着一层 GitHub 自己打的 zip，
      # 解出来只有各自那一个文件，这里挑出要发布的那三个
      - name: 收拢发布文件
        run: |
          mkdir -p release
          cp artifacts/afdian-sku-tool-windows/afdian_sku_app.exe        release/
          cp artifacts/afdian-sku-tool-macos/afdian_sku_app-macos.zip    release/
          cp artifacts/afdian-sku-tool-linux/afdian_sku_app-linux.tar.gz release/
          ls -l release

      # 说明文案在 .github/release-notes.md 里，改那个文件就行
      # 已经发过 Release 的情况（比如重新推了 tag）就改成补传，不重复建
      - name: 发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "$tag" \
              --notes-file .github/release-notes.md
          fi
